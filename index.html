<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Pulse | 2026 Research</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F8F9FA;
            --accent: #1A1A1A;
            --muted: #8E8E93;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Subtle animated background for aesthetic points */
        body::before {
            content: "";
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, #E0E7FF 0%, transparent 70%);
            top: -100px; right: -100px;
            z-index: -1;
        }

        .survey-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 32px;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -1.5px;
            margin-bottom: 30px;
            line-height: 1;
        }

        .input-group { margin-bottom: 35px; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 12px;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #E5E5E5;
            padding: 10px 0;
            font-size: 1.25rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.4s;
        }

        input:focus, textarea:focus { border-color: var(--accent); }

        /* Stress Slider */
        input[type="range"] {
            width: 100%;
            margin: 20px 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn-next {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-next:hover { transform: translateY(-2px); opacity: 0.9; }

        .btn-back {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .done-state { text-align: center; }
        .done-state h2 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="survey-card">
        <div class="step active" id="step1">
            <h1>Personal Context.</h1>
            <div class="input-group">
                <label>Age</label>
                <input type="number" placeholder="20">
            </div>
            <div class="input-group">
                <label>Branch</label>
                <input type="text" placeholder="e.g. Computer Science">
            </div>
            <div class="btn-row">
                <span></span>
                <button class="btn-next" onclick="nextStep(2)">Next →</button>
            </div>
        </div>

        <div class="step" id="step2">
            <h1>Mental Load.</h1>
            <div class="input-group">
                <label>Current Exam Stress (1-10)</label>
                <input type="range" min="1" max="10" value="5">
                <div style="display:flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 600;">
                    <span>Low Tension</span>
                    <span>High Burnout</span>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-back" onclick="nextStep(1)">Back</button>
                <button class="btn-next" onclick="nextStep(3)">Next →</button>
            </div>
        </div>

        <div class="step" id="step3">
            <h1>Management.</h1>
            <div class="input-group">
                <label>How do you cope?</label>
                <input type="text" placeholder="e.g. Basketball, Sleep, Music">
            </div>
            <div class="input-group">
                <label>How does it help?</label>
                <textarea placeholder="Tell us about the effect..."></textarea>
            </div>
            <div class="btn-row">
                <button class="btn-back" onclick="nextStep(2)">Back</button>
                <button class="btn-next" onclick="nextStep(4)">Finish</button>
            </div>
        </div>

        <div class="step" id="step4">
            <div class="done-state">
                <h2>Done.</h2>
                <p style="color: var(--muted);">Data submitted for the 2026 report.</p>
                <button class="btn-next" style="margin-top: 20px;" onclick="location.reload()">Reset Survey</button>
            </div>
        </div>
    </div>

    <script>
        function nextStep(s) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById('step' + s).classList.add('active');
        }
    </script>

</body>
</html>
